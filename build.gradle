import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.file.CopySpec

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
}

group = module_group
version = module_version

base {
    archivesName = artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

def archiveMetadata = { CopySpec spec ->
    spec.from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-athena-resource-models' }
    }
    spec.from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-athena-resource-models.md' }
    }
    spec.from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-athena-resource-models.md' }
    }
    spec.from('provenance/origins.json') {
        into 'META-INF/bluemap-athena-resource-models'
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Implementation-Title': 'BlueMap Athena Resource Models',
                'Implementation-Version': project.version.toString()
        )
    }
    archiveMetadata(delegate)
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    archiveMetadata(delegate)
}

def binaryJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def sourceJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

def sha256 = { byte[] bytes ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(bytes).encodeHex().toString()
}

tasks.register('verifyOriginSources') {
    inputs.files(
            'provenance/origins.json',
            fileTree('src/main/java') { include '**/*.java' },
            fileTree('src/test/java/io/github/janguenter/bluemap/chipped/model') {
                include '*.java'
            }
    )
    doLast {
        def provenance = new JsonSlurper().parse(file('provenance/origins.json'))
        if (provenance.component != artifact_id
                || provenance.version != project.version.toString()
                || provenance.sources.size() != 4) {
            throw new GradleException('Origin manifest identity or source count mismatch')
        }

        def declaredProduction = provenance.sources.collect { it.production_path } as Set
        def actualProduction = fileTree('src/main/java') {
            include '**/*.java'
        }.files.collect { project.relativePath(it) } as Set
        if (declaredProduction != actualProduction) {
            throw new GradleException("Production source tree mismatch: ${actualProduction}")
        }

        def declaredOracles = provenance.sources.collect { it.oracle_path } as Set
        def actualOracles = fileTree('src/test/java/io/github/janguenter/bluemap/chipped/model') {
            include '*.java'
        }.files.collect { project.relativePath(it) } as Set
        if (declaredOracles != actualOracles) {
            throw new GradleException("Origin oracle tree mismatch: ${actualOracles}")
        }

        provenance.sources.each { source ->
            def oracle = file(source.oracle_path)
            def production = file(source.production_path)
            def oracleHash = sha256(oracle.bytes)
            if (oracleHash != source.origin_sha256) {
                throw new GradleException(
                        "Frozen origin mismatch for ${source.origin_path}: ${oracleHash}"
                )
            }

            def normalized = production.getText('UTF-8')
            source.normalizations.each { replacement ->
                if (!normalized.contains(replacement.from)) {
                    throw new GradleException(
                            "Missing declared normalization in ${source.production_path}: "
                                    + replacement.from
                    )
                }
                normalized = normalized.replace(replacement.from, replacement.to)
            }
            def normalizedHash = sha256(normalized.getBytes('UTF-8'))
            if (normalizedHash != source.origin_sha256) {
                throw new GradleException(
                        "Normalized production mismatch for ${source.origin_path}: "
                                + normalizedHash
                )
            }
        }
    }
}

tasks.register('verifyAthenaModelsJar') {
    dependsOn tasks.named('jar')
    inputs.file(binaryJar)
    doLast {
        def expected = [
                'META-INF/MANIFEST.MF',
                'META-INF/LICENSE-bluemap-athena-resource-models',
                'META-INF/NOTICE-bluemap-athena-resource-models.md',
                'META-INF/THIRD_PARTY-bluemap-athena-resource-models.md',
                'META-INF/bluemap-athena-resource-models/origins.json',
                'io/github/janguenter/bluemap/resource/athena/model/CtmConnections.class',
                'io/github/janguenter/bluemap/resource/athena/model/CtmSelector.class',
                'io/github/janguenter/bluemap/resource/athena/model/CtmTextureRole.class',
                'io/github/janguenter/bluemap/resource/athena/model/CubeFace.class',
                'io/github/janguenter/bluemap/resource/athena/model/CubeFace$Vec.class'
        ] as Set
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            if (entries.toSet().size() != entries.size() || entries.toSet() != expected) {
                throw new GradleException("Athena models JAR boundary mismatch: ${entries}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyAthenaModelsSourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(sourceJar)
    doLast {
        def expected = [
                'META-INF/MANIFEST.MF',
                'META-INF/LICENSE-bluemap-athena-resource-models',
                'META-INF/NOTICE-bluemap-athena-resource-models.md',
                'META-INF/THIRD_PARTY-bluemap-athena-resource-models.md',
                'META-INF/bluemap-athena-resource-models/origins.json',
                'io/github/janguenter/bluemap/resource/athena/model/CtmConnections.java',
                'io/github/janguenter/bluemap/resource/athena/model/CtmSelector.java',
                'io/github/janguenter/bluemap/resource/athena/model/CtmTextureRole.java',
                'io/github/janguenter/bluemap/resource/athena/model/CubeFace.java'
        ] as Set
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            if (entries.toSet().size() != entries.size() || entries.toSet() != expected) {
                throw new GradleException("Athena models sources JAR boundary mismatch: ${entries}")
            }
        } finally {
            zip.close()
        }
    }
}

publishing {
    publications {
        athenaModels(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = 'BlueMap Athena Resource Models'
                description = 'Source-bundled Athena connection and face models for BlueMap add-ons.'
                url = 'https://github.com/jan-guenter/bluemap-athena-resource-models'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'jan-guenter'
                        name = 'Jan Guenter'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-athena-resource-models.git'
                    developerConnection =
                            'scm:git:ssh://git@github.com/jan-guenter/bluemap-athena-resource-models.git'
                    url = 'https://github.com/jan-guenter/bluemap-athena-resource-models'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-athena-resource-models')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

tasks.register('verifyPublication') {
    dependsOn tasks.named('generatePomFileForAthenaModelsPublication')
    dependsOn tasks.named('generateMetadataFileForAthenaModelsPublication')
    inputs.files(
            layout.buildDirectory.file('publications/athenaModels/pom-default.xml'),
            layout.buildDirectory.file('publications/athenaModels/module.json')
    )
    doLast {
        def pom = new XmlSlurper(false, false).parse(
                layout.buildDirectory.file('publications/athenaModels/pom-default.xml').get().asFile
        )
        if (pom.groupId.text() != project.group.toString()
                || pom.artifactId.text() != artifact_id
                || pom.version.text() != project.version.toString()
                || pom.dependencies.dependency.size() != 0) {
            throw new GradleException('POM identity or dependency boundary mismatch')
        }

        def metadata = new JsonSlurper().parse(
                layout.buildDirectory.file('publications/athenaModels/module.json').get().asFile
        )
        if (metadata.component.group != project.group.toString()
                || metadata.component.module != artifact_id
                || metadata.component.version != project.version.toString()
                || metadata.variants.any {
                    (it.dependencies ?: []).size() != 0
                            || (it.dependencyConstraints ?: []).size() != 0
                }) {
            throw new GradleException('Gradle module identity or dependency boundary mismatch')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyOriginSources')
    dependsOn tasks.named('verifyAthenaModelsJar')
    dependsOn tasks.named('verifyAthenaModelsSourcesJar')
}
